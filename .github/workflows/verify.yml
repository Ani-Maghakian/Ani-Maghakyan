name: Verify portfolio changes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x

      - name: Audit representative pages
        run: lhci autorun

      - name: Print Lighthouse quality matrix
        run: node scripts/print-lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci
            lighthouse-reports
          if-no-files-found: ignore
